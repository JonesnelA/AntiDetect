name: Build AntiDetect

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-install-1

      - name: Setup Theos (official installer)
        run: |
          if [ ! -d "$HOME/theos" ]; then
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          make FINALPACKAGE=1
          echo "---- artifacts ----"
          find .theos -name '*.dylib' | head

      - name: Extract raw dylib
        run: |
          mkdir -p out
          find .theos -name '*.dylib' -type f -exec cp {} out/ \;
          ls -la out/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: out/
          if-no-files-found: error
